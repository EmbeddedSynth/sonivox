name: macOS CI

on:
  workflow_dispatch:
  push:
    branches: [ "master", "devel" ]
  pull_request:
    branches: [ "master", "devel" ]

env:
  BUILD_TYPE: RelWithDebInfo
  INSTALL_LOCATION: ${{github.workspace}}/SonivoxV4
  TEMP: ${{github.workspace}}/temp

jobs:
  build:
    runs-on: macos-latest
    name: macOS CI

    steps:
    - uses: actions/checkout@v7

    - name: Temp Environment Variable
      run: |
        mkdir -p ${{github.workspace}}/temp

    # - name: Downloading a DLS file for testing
    #   uses: ethanjli/cached-download-action@v0.1.4
    #   with:
    #     url: http://www.ronimusic.com/sf2/Airfont_340.dls
    #     destination: ${{env.TEMP}}/soundfont.dls
    #     cache-key: cached.soundfont.dls
    #     enable-cross-os-archive: true

    - name: Configure CMake
      run: >
        cmake -B ${{github.workspace}}/build
        -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -DCMAKE_INSTALL_PREFIX=${{env.INSTALL_LOCATION}}
        -DSOUNDFONT_TEST=ON

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}} --verbose

    - name: Install
      run: cmake --install ${{github.workspace}}/build

    - name: Create Archive
      run: |
        cd ${{github.workspace}}
        tar cvf SonivoxV4.tar SonivoxV4

    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: SonivoxV4-macos
        path: SonivoxV4.tar
        retention-days: 90
        overwrite: true
